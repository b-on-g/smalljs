<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Svelte runner</title>

<!--
	Svelte is a compiler, so a .svelte component cannot run as it is written. This
	page compiles its components in the browser: the vendored compiler turns each
	source into a module when the page loads, and the modules are mounted from
	blob URLs. There is no build step and no bundler output here — what the
	comparison page shows as the source is the very text that got compiled.

	The compiler runs before the runner reports `ready`, so nothing it does falls
	inside a measured window: `Render time` starts at the Run click.

	Weights, so the compiler is not mistaken for what a Svelte app ships:
	svelte-compiler.js is 831 KB ( 216 KB gzipped ) and exists only for this page,
	while svelte-runtime.js is 104 KB ( 37 KB gzipped ) and is the part a real
	build would leave in the bundle.
-->

<script type="importmap">
{
	"imports": {
		"svelte": "../vendor/svelte-runtime.js",
		"svelte/internal/client": "../vendor/svelte-runtime.js",
		"svelte/internal/disclose-version": "../vendor/svelte-runtime.js"
	}
}
</script>

<style>

	/* Palette shared by all six runners. Written out here rather than taken
	   from the site's tokens: a frame is its own document and the site's CSS
	   variables do not cross into it. The columns are read side by side, so a
	   difference in hue between them would be read as a difference between the
	   frameworks. The page hands its theme over with a `theme` message and the
	   runner flips the attribute below, which costs neither a reload nor the
	   result of a run already made. */
	:root {
		color-scheme: light;
		--versus_back: #ffffff;
		--versus_surface: #fafafa;
		--versus_text: #18181b;
		--versus_shade: #71717a;
		--versus_line: #d4d4d8;
		--versus_line_soft: #e4e4e7;
		--versus_hover: #f4f4f5;
		--versus_current: #dbeafe;
		--versus_current_text: #1e40af;
	}

	:root[data-lights="dark"] {
		color-scheme: dark;
		--versus_back: #18181b;
		--versus_surface: #27272a;
		--versus_text: #d4d4d8;
		--versus_shade: #a1a1aa;
		--versus_line: #3f3f46;
		--versus_line_soft: #2f2f35;
		--versus_hover: #3f3f46;
		--versus_current: #1e40af;
		--versus_current_text: #dbeafe;
	}

	* { box-sizing: border-box }

	html, body { height: 100% }

	body {
		margin: 0;
		font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		color: var(--versus_text);
		background: var(--versus_back);
	}

	#host, .app { width: 100%; height: 100% }

	.muted { color: var(--versus_shade) }

	.row2 { display: flex; height: 100%; align-items: stretch }

	.side {
		width: 40%;
		min-width: 0;
		padding: 8px;
		overflow: auto;
		border-right: 1px solid var(--versus_line);
	}

	.main { flex: 1; min-width: 0; padding: 12px; overflow: auto }

	.item {
		display: block;
		width: 100%;
		margin-bottom: 2px;
		padding: 6px 8px;
		border: 0;
		border-radius: 4px;
		background: transparent;
		font: inherit;
		color: inherit;
		text-align: left;
		cursor: pointer;
	}

	.item:hover { background: var(--versus_hover) }

	.item_current { background: var(--versus_current); color: var(--versus_current_text) }

	.title { font-weight: 600; margin-bottom: 4px }

	.column { height: 100%; padding: 12px; overflow: auto }

	.stat { margin-bottom: 4px }

	.slot {
		margin-top: 8px;
		padding: 8px;
		min-height: 48px;
		border: 1px solid var(--versus_line);
		border-radius: 6px;
	}

	.scroll { height: 100%; padding: 8px; overflow: auto }

	.line { padding: 6px 8px; border-bottom: 1px solid var(--versus_line_soft); overflow-wrap: anywhere }

	.hint { padding: 6px 8px }

	.cards {
		display: grid;
		grid-template-columns: repeat( auto-fill, minmax( 120px, 1fr ) );
		gap: 8px;
		height: 100%;
		padding: 8px;
		overflow: auto;
		align-content: start;
	}

	.card { padding: 8px; border: 1px solid var(--versus_line); border-radius: 6px }

	.card_title { font-weight: 600 }

	.card_text { color: var(--versus_shade) }

	.standalone {
		position: fixed;
		right: 8px;
		bottom: 8px;
		padding: 6px 12px;
		border: 1px solid var(--versus_line);
		border-radius: 6px;
		background: var(--versus_surface);
		color: var(--versus_text);
		font: inherit;
		cursor: pointer;
	}

</style>
</head>
<body>

<div id="host"></div>

<script src="../vendor/svelte-compiler.js"></script>
<!--
	The runner sits in its own file rather than inline: component sources contain
	a closing script tag, and the HTML parser would end this element on the first
	one it finds inside a string.
-->
<script type="module" src="./runner.js"></script>

</body>
</html>
