		<!-- Язык приезжает позже страницы.

		     Статика по этому адресу собрана на одном языке ( голый адрес — это
		     x-default, то есть английский ), а читатель мог выбрать другой. Пока
		     качается бандл, браузер показывает то, что пришло, и на жёсткой
		     перезагрузке видно, как текст сначала английский, а потом прыгает.

		     Ждём: если язык страницы и язык читателя разошлись, прячем содержимое
		     до тех пор, пока приложение не проставит свой язык на <html> ( это
		     делает lang_sync ). Фон и раскладка остаются, прыгать нечему. Через
		     четыре секунды показываем что есть — бандл мог и не доехать. -->
		<script>
		(function () {
		  try {
		    var root = document.documentElement
		    var norm = function (s) { return String(s || '').toLowerCase().replace('-', '_') }
		    var stored = localStorage.getItem('locale')
		    var want = norm(stored ? JSON.parse(stored) : (navigator.language || 'en').replace(/-.*/, ''))
		    if (!want || want === norm(root.getAttribute('lang'))) return
		    root.setAttribute('bog_smalljs_boot', 'wait')
		    var done = function () {
		      root.removeAttribute('bog_smalljs_boot')
		      watcher.disconnect()
		      clearTimeout(timer)
		    }
		    var watcher = new MutationObserver(function () {
		      if (norm(root.getAttribute('lang')) === want) done()
		    })
		    watcher.observe(root, { attributes: true, attributeFilter: [ 'lang' ] })
		    var timer = setTimeout(done, 4000)
		  } catch (e) {}
		})();
		</script>
	</head>
	<body mol_view_root>
		<div mol_view_root="$bog_smalljs_app"></div>
		<script src="web.js"></script>
		<!-- GEO Audit AI traffic pixel -->
		<script>
		(function () {
		  try {
		    var ENDPOINT = "https://geoaudit24.ru/api/px/cmt0605lq003bhxkevrgs94k0";
		    function send(payload) {
		      var body = JSON.stringify(payload);
		      if (navigator.sendBeacon) {
		        navigator.sendBeacon(ENDPOINT, new Blob([body], { type: "application/json" }));
		      } else {
		        fetch(ENDPOINT, {
		          method: "POST",
		          headers: { "Content-Type": "application/json" },
		          body: body,
		          keepalive: true,
		          mode: "cors",
		          credentials: "omit"
		        }).catch(function () {});
		      }
		    }
		    try {
		      var aliveKey = "geo_px_" + ENDPOINT;
		      if (!sessionStorage.getItem(aliveKey)) {
		        sessionStorage.setItem(aliveKey, "1");
		        send({ alive: true, path: location.pathname });
		      }
		    } catch (eAlive) {
		      send({ alive: true, path: location.pathname });
		    }
		    var params = new URLSearchParams(location.search);
		    var utm = params.get("utm_source") || "";
		    var ref = document.referrer || "";
		    if (!utm && !ref) return;
		    send({
		      referrer: ref.slice(0, 500),
		      utmSource: utm.slice(0, 100),
		      path: location.pathname
		    });
		  } catch (e) {}
		})();
		</script>
	</body>
