name: $bog_smalljs_app

permissions: write-all

on:
    workflow_dispatch:
    push:
    pull_request:
    delete:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: hyoo-ru/mam_build@master2
              with:
                  package: "bog/smalljs"
                  modules: 'app'

            # SEO: prerender the main sections to static HTML + sitemap.xml/robots.txt.
            # The action varies a single route key; we prerender by `section`
            # (docs prerenders its default page, Introduction). Non-blocking so a
            # prerender hiccup never fails the deploy.
            - name: Prerender
              if: github.ref == 'refs/heads/main'
              continue-on-error: true
              uses: b-on-g/mol-prerender-action@v1
              with:
                  base-url: "https://b-on-g.github.io/smalljs/"
                  route-format: "#!"
                  route-key: "section"
                  screens: |
                      docs
                      playground

            # AI-friendly: raw .md endpoints (/docs/<slug>.md) + llms.txt in the
            # deploy root. content.ts/llms.txt are generated from these .md sources
            # by content/gen.cjs (committed); the .md files ship as-is here.
            - name: Copy Markdown endpoints + llms.txt
              if: github.ref == 'refs/heads/main'
              run: |
                  mkdir -p bog/smalljs/app/-/docs
                  cp bog/smalljs/content/en/docs/*.md bog/smalljs/app/-/docs/
                  cp bog/smalljs/content/llms.txt bog/smalljs/app/-/llms.txt

            - uses: hyoo-ru/gh-deploy@v4.4.1
              if: github.ref == 'refs/heads/main'
              with:
                  folder: "bog/smalljs/app/-"

            - name: Deploy feature branch
              if: startsWith(github.ref, 'refs/heads/feature/')
              uses: hyoo-ru/gh-deploy@v4.4.1
              with:
                  folder: "bog/smalljs/-"
                  target-folder: ${{ github.ref_name }}

    cleanup:
        if: github.event_name == 'delete' && startsWith(github.event.ref, 'feature/')
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: gh-pages

            - name: Remove feature folder
              run: |
                  BRANCH_NAME="${{ github.event.ref }}"
                  FOLDER="feature/${BRANCH_NAME#feature/}"
                  if [ -d "$FOLDER" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git rm -rf "$FOLDER"
                    git commit -m "Clean up preview for deleted branch: $BRANCH_NAME"
                    git push
                  fi
