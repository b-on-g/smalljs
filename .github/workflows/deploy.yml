name: $bog_smalljs_app

permissions: write-all

on:
    workflow_dispatch:
    push:
    pull_request:
    delete:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: hyoo-ru/mam_build@master2
              with:
                  package: "bog/smalljs"
                  # `lab` is the $mol side of the crash-test comparison: a
                  # separate, deliberately lean app (~400 KB unminified vs the site's
                  # ~2.4 MB) loaded into an iframe next to the React and Vue runners.
                  # It has to be its own bundle — folding it into the site via
                  # include/require would make the iframe pull the whole documentation
                  # site, and a comparison page that ships a bloated $mol bundle argues
                  # against itself.
                  modules: 'app lab'

            # SEO: prerender EVERY route (from the committed sitemap) to a real static
            # HTML file at /<route>/index.html, with per-page <title>/meta/og/canonical/
            # hreflang injected from the app's data-bog-meta. This is what makes deep
            # links index and unfurl on a static host (path routing → real 200s, not the
            # 404-fallback that crawlers/social scrapers can't follow). Non-blocking: a
            # prerender hiccup leaves the SPA + raw .md endpoints below, never fails deploy.
            - name: Prerender all routes to static HTML (SEO)
              if: github.ref == 'refs/heads/main'
              continue-on-error: true
              uses: b-on-g/mol-prerender-action@main
              with:
                  folder: "bog/smalljs/app/-"
                  base-url: "https://b-on-g.github.io/smalljs/"
                  route-format: "path"
                  sitemap-file: "bog/smalljs/content/sitemap.xml"
                  viewport: "1280x900"
                  # Откуда берётся контент маршрута. Даёт экшену перерисовывать
                  # только изменившиеся страницы вместо всех 896: правка одного
                  # абзаца переставала стоить сорок минут.
                  # Вторая строка обязательна — язык без перевода показывает
                  # английский текст, значит зависит и от английского файла.
                  route-content: |
                    bog/smalljs/content/{mol_locale=en}/docs/{page}.md
                    bog/smalljs/content/en/docs/{page}.md

            # Пиксель GEO Audit во ВСЕ выходные страницы. Отдельным шагом, а не
            # надеждой на пререндер: ключ кэша prerender-экшена считается от
            # web.js + web.css, а index.html в него не входит. Правка одного
            # index.html оставляет бандл прежним -> кэш попадает -> шаг
            # восстанавливает старые снимки поверх свежего файла, и пиксель
            # молча пропадает (ровно так и случилось 20.08.2026: деплой зелёный,
            # на проде пикселя нет). Инъекция после пререндера от этого не зависит
            # и заодно покрывает все 56 маршрутов, а не только главную.
            # Источник сниппета один — app/index.html; шаг его оттуда и читает,
            # так что менять id пикселя надо в одном месте.
            - name: Inject GEO Audit pixel into every page
              if: github.ref == 'refs/heads/main'
              run: node bog/smalljs/deploy/inject-pixel.cjs

            # Minify the JS bundle. MAM ships web.js unminified (~2.4 MB); esbuild's
            # whitespace + identifier minify takes it to ~1.9 MB (~10% smaller gzipped,
            # what GitHub Pages actually transfers). Safe for $mol: classes live on the
            # global `$.$name` and are reached by property access, which esbuild never
            # mangles — verified locally that the minified bundle renders, and that
            # search, the TypeScript-compiler playground, and navigation all still work.
            # `--charset=utf8` keeps the i18n content (CJK/Cyrillic) as literal bytes
            # instead of \uXXXX escapes, which would otherwise bloat the file. Runs after
            # prerender (which already snapshotted the HTML from the pre-minify bundle —
            # identical runtime output) and before the endpoint copy.
            - name: Minify JS bundle (esbuild)
              if: github.ref == 'refs/heads/main'
              run: |
                  npx --yes esbuild bog/smalljs/app/-/web.js \
                    --minify --charset=utf8 --allow-overwrite --sourcemap \
                    --outfile=bog/smalljs/app/-/web.js

            # Drop the render-blocking Google Fonts @import that the shared builderui
            # theme.css injects (it lives as a string inside the bundle, applied at
            # runtime). smalljs self-hosts every family it uses (Inter / EB Garamond /
            # JetBrains Mono, app.view.css.ts @font-face), so for the latin UI this
            # @import is pure dead weight — it triggers one blocking CSS request to
            # fonts.googleapis.com plus extra woff2 pulls from fonts.gstatic.com, on top
            # of the local files. Stripping it here (rather than editing the shared repo)
            # keeps it smalljs-only: other builderui consumers that do NOT self-host still
            # get the @import. Non-latin locales (e.g. cyrillic headings), which the local
            # subsets don't cover, fall back to the system serif/sans — already the
            # documented intent in app.view.css.ts. Verified locally: the page renders with
            # the self-hosted fonts and makes zero requests to fonts.googleapis/gstatic.
            - name: Strip render-blocking Google Fonts @import
              if: github.ref == 'refs/heads/main'
              run: |
                  node -e "const f='bog/smalljs/app/-/web.js';const fs=require('fs');const s=fs.readFileSync(f,'utf8');const o=s.replace(/@import url\('https:\/\/fonts\.googleapis\.com\/[^']*'\);/g,'');if(o.length===s.length){console.error('WARN: @import not found; skipping');}else{fs.writeFileSync(f,o);console.log('stripped',s.length-o.length,'bytes');}"

            # Extra static endpoints from content/gen.cjs (committed), shipped as-is:
            #  - raw Markdown (/docs/<slug>.md) — LLM-citable plain-text URLs
            #  - llms.txt (llmstxt.org index)
            #  - sitemap.xml + robots.txt (authoritative route list; also feeds the
            #    prerender step above). Copied after prerender so the committed files win.
            - name: Copy Markdown endpoints + llms.txt + sitemap/robots
              if: github.ref == 'refs/heads/main'
              run: |
                  mkdir -p bog/smalljs/app/-/docs
                  cp bog/smalljs/content/en/docs/*.md bog/smalljs/app/-/docs/
                  cp bog/smalljs/content/llms.txt bog/smalljs/app/-/llms.txt
                  cp bog/smalljs/content/sitemap.xml bog/smalljs/app/-/sitemap.xml
                  cp bog/smalljs/content/robots.txt bog/smalljs/app/-/robots.txt
                  # SPA fallback: GitHub Pages serves 404.html for any unknown path
                  # under the mount; its rafgraph redirect hands the deep-link back to
                  # index.html, which $bog_builderui_router expands into the real path.
                  cp bog/smalljs/404.html bog/smalljs/app/-/404.html
                  # Google Search Console ownership verification — must be served at the
                  # site root (https://…/smalljs/google….html), not under assets/.
                  cp bog/smalljs/assets/google20cffe7b64d91aa2.html bog/smalljs/app/-/google20cffe7b64d91aa2.html

            # Publish the $mol crash-test runner next to the React and Vue ones. The
            # target path mirrors the dev server's own layout exactly, so the iframe URL
            # is the same string in both places (`bog/smalljs/lab/-/index.html`)
            # and what we verify locally is literally what ships. Done as a copy step
            # rather than a `deploy` directive in app.meta.tree because deploy copies
            # whatever exists at the moment `app` is bundled, which says nothing about
            # whether `lab` has been built yet; an explicit copy after both
            # modules are built has no such ordering assumption.
            - name: Copy $mol crash-test runner
              if: github.ref == 'refs/heads/main'
              run: |
                  mkdir -p bog/smalljs/app/-/bog/smalljs/lab/-
                  cp bog/smalljs/lab/-/index.html \
                     bog/smalljs/lab/-/web.js \
                     bog/smalljs/app/-/bog/smalljs/lab/-/
                  # web.css only exists if the runner defines styles; don't fail without it.
                  cp bog/smalljs/lab/-/web.css \
                     bog/smalljs/app/-/bog/smalljs/lab/-/ 2>/dev/null || true

            - uses: hyoo-ru/gh-deploy@v4.4.1
              if: github.ref == 'refs/heads/main'
              with:
                  folder: "bog/smalljs/app/-"

            - name: Deploy feature branch
              if: startsWith(github.ref, 'refs/heads/feature/')
              uses: hyoo-ru/gh-deploy@v4.4.1
              with:
                  folder: "bog/smalljs/-"
                  target-folder: ${{ github.ref_name }}

    cleanup:
        if: github.event_name == 'delete' && startsWith(github.event.ref, 'feature/')
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: gh-pages

            - name: Remove feature folder
              run: |
                  BRANCH_NAME="${{ github.event.ref }}"
                  FOLDER="feature/${BRANCH_NAME#feature/}"
                  if [ -d "$FOLDER" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git rm -rf "$FOLDER"
                    git commit -m "Clean up preview for deleted branch: $BRANCH_NAME"
                    git push
                  fi
