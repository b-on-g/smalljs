name: $bog_smalljs_app

permissions: write-all

on:
    workflow_dispatch:
    push:
    pull_request:
    delete:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: hyoo-ru/mam_build@master2
              with:
                  package: "bog/smalljs"
                  modules: 'app'

            # SEO: prerender the main sections to static HTML + sitemap.xml/robots.txt.
            # The action varies a single route key; we prerender by `section`
            # (docs prerenders its default page, Introduction). Non-blocking so a
            # prerender hiccup never fails the deploy.
            - name: Prerender
              if: github.ref == 'refs/heads/main'
              continue-on-error: true
              uses: b-on-g/mol-prerender-action@main
              with:
                  base-url: "https://b-on-g.github.io/smalljs/"
                  route-format: "#!"
                  route-key: "section"
                  screens: |
                      docs
                      playground

            # AI-/crawler-friendly static endpoints, all generated deterministically
            # by content/gen.cjs (committed) and shipped as-is:
            #  - raw Markdown (/docs/<slug>.md) — real crawlable/LLM-citable URLs
            #  - llms.txt (llmstxt.org index)
            #  - sitemap.xml + robots.txt enumerating root + every /docs/<slug>.md
            # These are the authoritative SEO files: the app is a hash-routed SPA, so
            # `#!` deep links are not distinct URLs to crawlers — a link-crawl can't
            # enumerate pages, but this manifest-driven list can.
            - name: Copy Markdown endpoints + llms.txt + sitemap/robots
              if: github.ref == 'refs/heads/main'
              run: |
                  mkdir -p bog/smalljs/app/-/docs
                  cp bog/smalljs/content/en/docs/*.md bog/smalljs/app/-/docs/
                  cp bog/smalljs/content/llms.txt bog/smalljs/app/-/llms.txt
                  cp bog/smalljs/content/sitemap.xml bog/smalljs/app/-/sitemap.xml
                  cp bog/smalljs/content/robots.txt bog/smalljs/app/-/robots.txt

            # Full $bog_seo pipeline: build the SEO server, serve the deploy folder at
            # a root port (as gh-pages does), and dump prerendered HTML with injected
            # <title>/<meta>/<link rel=canonical|alternate>/og:* read from the app's
            # `data-bog-meta` (set by $bog_smalljs_app.meta()). `cp -rn` (no-clobber)
            # so the committed index.html/sitemap.xml/robots.txt above stay authoritative
            # — $bog_seo only *adds* prerendered routes it can discover. Non-blocking.
            - name: Build $bog_seo
              if: github.ref == 'refs/heads/main'
              continue-on-error: true
              run: npx mam bog/seo

            - name: Prerender + inject meta via $bog_seo
              if: github.ref == 'refs/heads/main'
              continue-on-error: true
              run: |
                  npx --yes serve -s bog/smalljs/app/- -l 9090 > /tmp/serve.log 2>&1 &
                  SERVE_PID=$!
                  sleep 3
                  BOG_SEO_UPSTREAM=http://localhost:9090 \
                  BOG_SEO_CANONICAL_BASE="https://b-on-g.github.io/smalljs" \
                  BOG_SEO_DUMP_DIR="bog/smalljs/app/-/_seo" \
                  BOG_SEO_WARMUP=true \
                  node bog/seo/-/node.js
                  kill $SERVE_PID || true
                  if [ -d "bog/smalljs/app/-/_seo" ]; then
                      cp -rn bog/smalljs/app/-/_seo/* bog/smalljs/app/-/ || true
                      rm -rf bog/smalljs/app/-/_seo
                  fi

            - uses: hyoo-ru/gh-deploy@v4.4.1
              if: github.ref == 'refs/heads/main'
              with:
                  folder: "bog/smalljs/app/-"

            - name: Deploy feature branch
              if: startsWith(github.ref, 'refs/heads/feature/')
              uses: hyoo-ru/gh-deploy@v4.4.1
              with:
                  folder: "bog/smalljs/-"
                  target-folder: ${{ github.ref_name }}

    cleanup:
        if: github.event_name == 'delete' && startsWith(github.event.ref, 'feature/')
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: gh-pages

            - name: Remove feature folder
              run: |
                  BRANCH_NAME="${{ github.event.ref }}"
                  FOLDER="feature/${BRANCH_NAME#feature/}"
                  if [ -d "$FOLDER" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git rm -rf "$FOLDER"
                    git commit -m "Clean up preview for deleted branch: $BRANCH_NAME"
                    git push
                  fi
